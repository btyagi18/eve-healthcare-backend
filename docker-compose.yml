services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eve_healthcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eve_healthcare
      JWT_SECRET: change-this-in-production
      JWT_EXPIRES_IN: 1d
      NODE_ENV: production
    ports:
      - "5000:5000"

volumes:
  postgres_data:
